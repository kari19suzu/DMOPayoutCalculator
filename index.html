<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMO Payout Calculator</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --input-bg: #2c2c2c;
    --text-main: #e0e0e0;
    --text-muted: #a0a0a0;
    --accent-primary: #bb86fc;
    --accent-secondary: #03dac6;
    --accent-tertiary: #cf6679;
    --border-color: #333333;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    padding: 20px; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 90vh;
    margin: 0;
  }

  .calculator { 
    background: var(--card-bg); 
    padding: 30px; 
    border-radius: 12px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    width: 100%; 
    max-width: 420px; 
    border: 1px solid var(--border-color);
  }

  h2 { 
    text-align: center; 
    color: var(--accent-primary); 
    margin-top: 0; 
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .form-group { margin-bottom: 18px; }
  
  label { 
    display: block; 
    margin-bottom: 6px; 
    font-weight: 500; 
    font-size: 0.9em; 
    color: var(--text-muted);
  }

  input[type="number"], select { 
    width: 100%; 
    padding: 12px; 
    border: 1px solid var(--border-color); 
    border-radius: 8px; 
    background: var(--input-bg); 
    color: white; 
    font-size: 1em;
    box-sizing: border-box; 
    transition: border-color 0.2s;
  }

  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent-primary);
  }

  .checkbox-group { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    background: var(--input-bg);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
  }

  .checkbox-group label {
    margin: 0;
    cursor: pointer;
    color: var(--text-main);
  }

  input[type="checkbox"] { 
    transform: scale(1.3); 
    cursor: pointer;
    accent-color: var(--accent-primary);
  }

  .results { 
    margin-top: 30px; 
    padding-top: 20px; 
    border-top: 2px solid var(--border-color); 
  }

  .result-row { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 10px; 
    font-size: 0.95em; 
  }

  .result-row .value { font-family: monospace; font-size: 1.1em; }

  .total-row { 
    font-size: 1.2em; 
    font-weight: bold; 
    color: var(--accent-secondary); 
    margin-top: 15px; 
    border-top: 1px dashed var(--border-color); 
    padding-top: 15px;
  }
  
  .total-row .value { font-size: 1.1em; }

  .inventory-row { 
    font-size: 1.4em; 
    font-weight: bold; 
    color: var(--accent-tertiary); 
    margin-top: 15px; 
    background: rgba(207, 102, 121, 0.1);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid rgba(207, 102, 121, 0.3);
  }

  .inventory-row .value { font-size: 1.1em; }
</style>
</head>
<body>

<div class="calculator">
  <h2>DMO Payout Calculator</h2>

  <div class="form-group">
    <label for="difficulty">Difficulty Mode</label>
    <select id="difficulty">
      <option value="hard">Hard Mode (100 LP = $1)</option>
      <option value="easy">Easy Mode (200 LP = $1)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="damage">Total Damage Dealt (LP)</label>
    <input type="number" id="damage" value="4000" step="100" min="0">
  </div>

  <div class="form-group">
    <label for="cards">Cards Played</label>
    <input type="number" id="cards" value="5" min="0">
  </div>

  <div class="form-group">
    <label for="turns">Turns Passed</label>
    <input type="number" id="turns" value="3" min="1">
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="win" checked>
    <span>Match Won?</span>
  </label>

  <div class="results">
    <div class="result-row"><span>Damage Bonus:</span> <span class="value" id="res-damage">$40</span></div>
    <div class="result-row"><span>Card Bonus:</span> <span class="value" id="res-cards">$5</span></div>
    <div class="result-row"><span>Turn Bonus:</span> <span class="value" id="res-turns">$12</span></div>
    <div class="result-row"><span>Winner Bonus:</span> <span class="value" id="res-winner">$6</span></div>
    
    <div class="result-row total-row">
      <span>Visual Payout:</span> 
      <span class="value" id="res-visual">$63</span>
    </div>
    
    <div class="result-row inventory-row">
      <span>Inventory Payout:</span> 
      <span class="value" id="res-inventory">$126</span>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const difficulty = document.getElementById('difficulty').value;
    const damage = parseInt(document.getElementById('damage').value) || 0;
    const cards = parseInt(document.getElementById('cards').value) || 0;
    const turns = parseInt(document.getElementById('turns').value) || 0;
    const win = document.getElementById('win').checked;

    // 1. Damage Bonus
    const damageDivisor = (difficulty === 'hard') ? 100 : 200;
    const damageBonus = Math.floor(damage / damageDivisor);

    // 2. Cards Bonus
    const cardBonus = cards;

    // 3. Turns & Winner Bonus
    let turnBonus = 0;
    let winnerBonus = 0;

    if (turns >= 3) {
      turnBonus = 12 + ((turns - 3) * 4);
      if (win) {
        winnerBonus = 6;
      }
    }

    // 4. Totals
    const visualPayout = damageBonus + cardBonus + turnBonus + winnerBonus;
    const inventoryPayout = visualPayout * 2;

    // Update UI
    document.getElementById('res-damage').innerText = '$' + damageBonus;
    document.getElementById('res-cards').innerText = '$' + cardBonus;
    document.getElementById('res-turns').innerText = '$' + turnBonus;
    document.getElementById('res-winner').innerText = '$' + winnerBonus;
    document.getElementById('res-visual').innerText = '$' + visualPayout;
    document.getElementById('res-inventory').innerText = '$' + inventoryPayout;
  }

  // Attach event listeners for real-time updates
  const inputs = document.querySelectorAll('input, select');
  inputs.forEach(input => input.addEventListener('input', calculate));
  
  // Initial calculation on load
  calculate();
</script>
</body>
</html>
