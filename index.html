<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMO Payout Calculator</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --input-bg: #2c2c2c;
    --text-main: #e0e0e0;
    --text-muted: #a0a0a0;
    --accent-primary: #bb86fc;
    --accent-secondary: #03dac6;
    --accent-tertiary: #cf6679;
    --border-color: #333333;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    padding: 20px; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 90vh;
    margin: 0;
  }

  .calculator { 
    background: var(--card-bg); 
    padding: 30px; 
    border-radius: 12px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    width: 100%; 
    max-width: 440px; 
    border: 1px solid var(--border-color);
  }

  h2 { 
    text-align: center; 
    color: var(--accent-primary); 
    margin-top: 0; 
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .form-group { margin-bottom: 18px; }
  
  label { 
    display: block; 
    margin-bottom: 6px; 
    font-weight: 500; 
    font-size: 0.9em; 
    color: var(--text-muted);
  }

  input[type="number"], input[type="text"], select { 
    width: 100%; 
    padding: 12px; 
    border: 1px solid var(--border-color); 
    border-radius: 8px; 
    background: var(--input-bg); 
    color: white; 
    font-size: 1em;
    box-sizing: border-box; 
    transition: border-color 0.2s;
  }

  input[type="number"]:focus, input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent-primary);
  }

  /* Structural evolution for the multi-NPC tracking layout */
  .npc-container-block {
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.01);
  }

  .npc-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  .npc-row input[type="text"] { flex: 1.2; }
  .npc-row select { flex: 0.9; padding: 12px 6px; }
  .npc-row input[type="number"] { flex: 1.1; }

  .btn-action {
    background: var(--input-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .btn-action:hover {
    background: var(--border-color);
  }

  .btn-add {
    width: 100%;
    margin-top: 4px;
    border-color: rgba(187, 134, 252, 0.3);
    color: var(--accent-primary);
  }

  .btn-add:hover {
    border-color: var(--accent-primary);
    background: rgba(187, 134, 252, 0.05);
  }

  .btn-delete {
    color: var(--accent-tertiary);
    border-color: rgba(207, 102, 121, 0.2);
    padding: 11px 12px;
  }

  .btn-delete:hover {
    border-color: var(--accent-tertiary);
    background: rgba(207, 102, 121, 0.05);
  }

  .checkbox-group { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    background: var(--input-bg);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
  }

  .checkbox-group label {
    margin: 0;
    cursor: pointer;
    color: var(--text-main);
  }

  input[type="checkbox"] { 
    transform: scale(1.3); 
    cursor: pointer;
    accent-color: var(--accent-primary);
  }

  .results { 
    margin-top: 30px; 
    padding-top: 20px; 
    border-top: 2px solid var(--border-color); 
  }

  .result-row { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 10px; 
    font-size: 0.95em; 
  }

  .result-row .value { font-family: monospace; font-size: 1.1em; }

  .total-row { 
    font-size: 1.2em; 
    font-weight: bold; 
    color: var(--accent-secondary); 
    margin-top: 15px; 
    border-top: 1px dashed var(--border-color); 
    padding-top: 15px;
  }
  
  .total-row .value { font-size: 1.1em; }

  .inventory-row { 
    font-size: 1.4em; 
    font-weight: bold; 
    color: var(--accent-tertiary); 
    margin-top: 15px; 
    background: rgba(207, 102, 121, 0.1);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid rgba(207, 102, 121, 0.3);
  }

  .inventory-row .value { font-size: 1.1em; }
</style>
</head>
<body>

<div class="calculator">
  <h2>DMO Payout Calculator</h2>

  <!-- Evolved Target Setup Block -->
  <div class="npc-container-block">
    <label>Targets & Damage Dealt</label>
    <div id="npc-list">
      <div class="npc-row">
        <input type="text" placeholder="Name" value="NPC 1">
        <select class="npc-mode">
          <option value="hard">Hard</option>
          <option value="easy">Easy</option>
        </select>
        <input type="number" class="npc-damage" value="4000" step="100" min="0">
        <button class="btn-action btn-delete" onclick="removeNPCRow(this)">✕</button>
      </div>
    </div>
    <button class="btn-action btn-add" onclick="addNPCRow()">+ Add Target NPC</button>
  </div>

  <div class="form-group">
    <label for="cards">Cards Played</label>
    <input type="number" id="cards" value="5" min="0">
  </div>

  <div class="form-group">
    <label for="turns">Turns Passed</label>
    <input type="number" id="turns" value="3" min="1">
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="win" checked>
    <span>Match Won?</span>
  </label>

  <div class="results">
    <div class="result-row"><span>Total Damage Tracked:</span> <span class="value" id="res-total-damage">4,000 LP</span></div>
    <div class="result-row"><span>Damage Bonus:</span> <span class="value" id="res-damage">$40</span></div>
    <div class="result-row"><span>Card Bonus:</span> <span class="value" id="res-cards">$5</span></div>
    <div class="result-row"><span>Turn Bonus:</span> <span class="value" id="res-turns">$12</span></div>
    <div class="result-row"><span>Winner Bonus:</span> <span class="value" id="res-winner">$6</span></div>
    
    <div class="result-row total-row">
      <span>Visual Payout:</span> 
      <span class="value" id="res-visual">$63</span>
    </div>
    
    <div class="result-row inventory-row">
      <span>Inventory Payout:</span> 
      <span class="value" id="res-inventory">$126</span>
    </div>
  </div>
</div>

<script>
  let targetIndex = 1;

  function addNPCRow() {
    targetIndex++;
    const listContainer = document.getElementById('npc-list');
    const newRow = document.createElement('div');
    newRow.className = 'npc-row';
    newRow.innerHTML = `
      <input type="text" placeholder="Name" value="NPC ${targetIndex}">
      <select class="npc-mode">
        <option value="hard">Hard</option>
        <option value="easy">Easy</option>
      </select>
      <input type="number" class="npc-damage" value="0" step="100" min="0">
      <button class="btn-action btn-delete" onclick="removeNPCRow(this)">✕</button>
    `;
    listContainer.appendChild(newRow);
    
    // Bind updates dynamically for new fields
    newRow.querySelector('.npc-damage').addEventListener('input', calculate);
    newRow.querySelector('.npc-mode').addEventListener('change', calculate);
    newRow.querySelector('input[type="text"]').addEventListener('input', calculate);
    
    calculate();
  }

  function removeNPCRow(btnElement) {
    const parentRow = btnElement.parentElement;
    const listContainer = document.getElementById('npc-list');
    
    if (listContainer.children.length > 1) {
      parentRow.remove();
      calculate();
    } else {
      // Clean slate reset if it's the solitary field remaining
      parentRow.querySelector('input[type="number"]').value = 0;
      parentRow.querySelector('select').value = 'hard';
      calculate();
    }
  }

  function calculate() {
    const cards = parseInt(document.getElementById('cards').value) || 0;
    const turns = parseInt(document.getElementById('turns').value) || 0;
    const win = document.getElementById('win').checked;

    let aggregateDamage = 0;
    let hardDamagePool = 0;
    let easyDamagePool = 0;

    // Scan all active NPC entries
    const currentRows = document.querySelectorAll('.npc-row');
    currentRows.forEach(row => {
      const dmgValue = parseInt(row.querySelector('.npc-damage').value) || 0;
      const targetMode = row.querySelector('.npc-mode').value;
      
      aggregateDamage += dmgValue;
      
      if (targetMode === 'hard') {
        hardDamagePool += dmgValue;
      } else if (targetMode === 'easy') {
        easyDamagePool += dmgValue;
      }
    });

    // 1. Damage Calculations (Hard = LP/100, Easy = LP/200)
    const damageBonus = Math.floor(hardDamagePool / 100) + Math.floor(easyDamagePool / 200);

    // 2. Played Cards Allocation
    const cardBonus = cards;

    // 3. Round Metric & Victor Bonuses
    let turnBonus = 0;
    let winnerBonus = 0;

    if (turns >= 3) {
      turnBonus = 12 + ((turns - 3) * 4);
      if (win) {
        winnerBonus = 6;
      }
    }

    // 4. Grand Calculation Aggregates
    const visualPayout = damageBonus + cardBonus + turnBonus + winnerBonus;
    const inventoryPayout = visualPayout * 2;

    // Display updates back to UI
    document.getElementById('res-total-damage').innerText = aggregateDamage.toLocaleString() + ' LP';
    document.getElementById('res-damage').innerText = '$' + damageBonus;
    document.getElementById('res-cards').innerText = '$' + cardBonus;
    document.getElementById('res-turns').innerText = '$' + turnBonus;
    document.getElementById('res-winner').innerText = '$' + winnerBonus;
    document.getElementById('res-visual').innerText = '$' + visualPayout;
    document.getElementById('res-inventory').innerText = '$' + inventoryPayout;
  }

  // Baseline standard framework tracking
  document.getElementById('cards').addEventListener('input', calculate);
  document.getElementById('turns').addEventListener('input', calculate);
  document.getElementById('win').addEventListener('change', calculate);
  
  // Base structural index row layout binding
  document.querySelector('.npc-damage').addEventListener('input', calculate);
  document.querySelector('.npc-mode').addEventListener('change', calculate);

  // Initial build run execution
  calculate();
</script>
</body>
</html>
